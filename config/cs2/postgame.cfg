// =============================================================================
// Postgame : enregistrement des démos de deathmatch / entraînement en une touche
// (exigence CS-SRC-02). Commandes client standard (record / stop) : rien d'autre.
//
// Installation : voir config/cs2/LISEZMOI.md
//   1. copier ce fichier dans  ...\Counter-Strike Global Offensive\game\csgo\cfg\
//   2. ajouter la ligne « exec postgame » à la fin de autoexec.cfg (même dossier)
//   3. options de lancement Steam de CS2 : +exec autoexec
//
// Usage : F8 démarre l'enregistrement, F8 l'arrête. Rien d'autre à faire : le
// service Postgame importe la démo quelques secondes après l'arrêt.
//
// Les démos s'appellent postgame_01.dem … postgame_10.dem, dans game\csgo\. Chaque
// nouvel enregistrement prend le nom suivant (et revient à 01 au relancement du
// jeu) : Postgame archive chaque démo dès qu'elle est finie, donc la réécriture
// d'un ancien nom ne fait rien perdre tant que le service tourne.
// =============================================================================

alias pg_rec_01 "record postgame_01"
alias pg_rec_02 "record postgame_02"
alias pg_rec_03 "record postgame_03"
alias pg_rec_04 "record postgame_04"
alias pg_rec_05 "record postgame_05"
alias pg_rec_06 "record postgame_06"
alias pg_rec_07 "record postgame_07"
alias pg_rec_08 "record postgame_08"
alias pg_rec_09 "record postgame_09"
alias pg_rec_10 "record postgame_10"

// Emplacement courant (pg_rec) et suivant (pg_suivant).
alias pg_slot_01 "alias pg_rec pg_rec_01; alias pg_suivant pg_slot_02"
alias pg_slot_02 "alias pg_rec pg_rec_02; alias pg_suivant pg_slot_03"
alias pg_slot_03 "alias pg_rec pg_rec_03; alias pg_suivant pg_slot_04"
alias pg_slot_04 "alias pg_rec pg_rec_04; alias pg_suivant pg_slot_05"
alias pg_slot_05 "alias pg_rec pg_rec_05; alias pg_suivant pg_slot_06"
alias pg_slot_06 "alias pg_rec pg_rec_06; alias pg_suivant pg_slot_07"
alias pg_slot_07 "alias pg_rec pg_rec_07; alias pg_suivant pg_slot_08"
alias pg_slot_08 "alias pg_rec pg_rec_08; alias pg_suivant pg_slot_09"
alias pg_slot_09 "alias pg_rec pg_rec_09; alias pg_suivant pg_slot_10"
alias pg_slot_10 "alias pg_rec pg_rec_10; alias pg_suivant pg_slot_01"
pg_slot_01

// Bascule marche / arrêt.
alias pg_demarrer "pg_rec; pg_suivant; alias pg_bascule pg_arreter; echo [Postgame] enregistrement en cours"
alias pg_arreter "stop; alias pg_bascule pg_demarrer; echo [Postgame] enregistrement arrete"
alias pg_bascule "pg_demarrer"

bind "F8" "pg_bascule"

echo "[Postgame] config chargee : F8 = demarrer / arreter l'enregistrement"
