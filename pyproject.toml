[project]
name = "postgame"
version = "0.1.0"
description = "Coach personnel multi-jeux : analyse, replays, second écran."
requires-python = ">=3.13"
dependencies = [
    "demoparser2>=0.42",
    "polars>=2.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
postgame = "postgame.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = [
    "demo_reelle: test qui exige une vraie démo CS2 dans tests/donnees/ (ignoré sinon)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
