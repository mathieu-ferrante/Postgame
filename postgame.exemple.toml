# Configuration locale de Postgame.
# Copier ce fichier en « postgame.toml » (ignoré par git) et l'adapter.
# Aucun secret ne doit être mis dans le fichier d'exemple.

[service]
hote = "0.0.0.0"          # 0.0.0.0 = joignable depuis le téléphone et le Mac du réseau local
port = 8765
dossier_donnees = "data"  # base SQLite + copies archivées des démos
# HTTPS, pour installer l'interface sur le téléphone (voir A_VALIDER.md, mkcert) :
# certificat = "certs/postgame.pem"
# cle_privee = "certs/postgame-key.pem"

[joueur]
# SteamID64 de Mathieu (17 chiffres, ex. 7656119xxxxxxxxxx) : sert à savoir quel joueur
# analyser dans une démo. Visible sur steamid.io ou dans l'URL de son profil Steam.
steamid = ""

[cs2]
# Dossiers surveillés : les démos Premier téléchargées depuis le jeu atterrissent dans
# « replays », les démos enregistrées avec « record » dans « game\csgo ».
dossiers_demos = [
    "C:/Program Files (x86)/Steam/steamapps/common/Counter-Strike Global Offensive/game/csgo/replays",
    "C:/Program Files (x86)/Steam/steamapps/common/Counter-Strike Global Offensive/game/csgo",
]

[gd]
# Journaux écrits par le mod Geode « Postgame — journal » (mods/gd-journal).
dossiers_journaux = [
    "%LOCALAPPDATA%/GeometryDash/geode/mods/mathieu.postgame-journal/sessions",
]

[surveillance]
intervalle_s = 5          # période de scrutation des dossiers
delai_stabilite_s = 10    # un fichier doit garder la même taille ce temps-là avant import

[debrief]
# Fournisseur du débrief rédigé : "gemini" (défaut), "local" (Ollama) ou "aucun" (liste
# structurée, sans modèle de langage). La clé Gemini va dans secrets.toml, jamais ici.
fournisseur = "gemini"
modele = "gemini-3.1-flash-lite"
url_local = "http://localhost:11434"
prix_entree = 0.25   # $ par million de jetons envoyés
prix_sortie = 1.50   # $ par million de jetons reçus
automatique = true   # rédiger le débrief dès l'import
mesures_experimentales = false  # true pendant la validation des mesures (signalées)
historique = 10      # parties précédentes servant de référence personnelle
